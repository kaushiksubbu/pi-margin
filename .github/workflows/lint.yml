name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install flake8 autopep8

      - name: autopep8 fix
        run: |
          # Use find to ensure we are targeting the right files regardless of shell quirks
          find src/ -type f -name "*.py" -not -xtype l | xargs autopep8 --in-place --aggressive --aggressive

      - name: flake8 check
        run: flake8 --exclude=src/common_func/db_utils.py src/
